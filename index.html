<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayansh's Cloud</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Inter, system-ui, sans-serif;
        background: #0f1117;
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 900px;
        text-align: center;
    }

    h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
    }

    p {
        color: #9ca3af;
        margin-bottom: 40px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
    }

    .card {
        background: #171a21;
        border: 1px solid #252a35;
        border-radius: 16px;
        padding: 28px;
        text-decoration: none;
        color: white;
        transition: all 0.2s ease;
    }

    .card:hover {
        transform: translateY(-4px);
        border-color: #4f46e5;
    }

    .card h2 {
        margin-bottom: 10px;
        font-size: 1.2rem;
    }

    .card p {
        margin: 0;
        color: #9ca3af;
        font-size: 0.95rem;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Ayansh's Cloud</h1>
    <p>Personal cloud services</p>

    <div class="cards">
        <a class="card" href="https://cloud.ayansh25.me">
            <h2>☁️ Cloud Desktop</h2>
            <p>Access my cloud PC</p>
        </a>

        <a class="card" href="https://files.ayansh25.me">
            <h2>📁 Files</h2>
            <p>Browse and manage files</p>
        </a>

        <a class="card" href="https://start.ayansh25.me">
            <h2>🚀 Start Server</h2>
            <p>Wake the cloud PC</p>
        </a>
       <a class="card" href="https://mcpanel.ayansh25.me">
          <h2>🎮 MC Panel</h2>
          <p>Server management & console</p>
</a>
    </div>
</div>

</body>
</html>
